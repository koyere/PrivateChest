# -------------------------------------------------- #
#              PrivateChest Messages File            #
# -------------------------------------------------- #
#
# Customize all messages sent by the PrivateChest plugin here.
# Use standard Bukkit color codes (&) for colors and formatting.
# Placeholders like {amount} will be replaced automatically.
#

# --- General Errors & Permissions ---

# Sent when a player lacks the necessary permission.
no_permission: "&cYou do not have permission to use this command."
# Sent when a console tries to run a player-only command.
console_only_player: "&cThis command can only be used by players."
# Sent when the target block isn't a Chest, Trapped Chest, or Barrel.
not_a_chest: "&cYou must be looking at a Chest or Barrel to use this command."
# Sent when trying to interact with a chest that isn't locked.
not_locked: "&eThis container is not locked."
# Sent when a player tries to use a container they have no access to.
# Supports {container} and {owner}.
not_your_chest: "&cThis {container} belongs to {owner}."
# Generic error for unexpected issues.
error_generic: "&cAn unexpected error occurred. Please contact an administrator."
# Used in place of a player name when the name of a stored UUID cannot be resolved.
unknown_player: "Unknown"

# --- Lock Command (/lockchest) ---

# Sent when /lockchest is used incorrectly.
usage_lock: "&cUsage: /lockchest <password>"
# Sent when /lockchest successfully locks a container. {container} is the container type name.
locked: "&aThis {container} has been locked."
# Sent when trying to lock an already locked container.
already_locked: "&eThis container is already locked."

# --- Unlock Command (/unlockchest) ---

# Sent when /unlockchest is used incorrectly.
usage_unlock: "&cUsage: /unlockchest <password>"
# Sent when /unlockchest successfully unlocks a container.
unlocked: "&aContainer unlocked successfully!"
# Sent when the wrong password is provided for /unlockchest.
wrong_password: "&cIncorrect password. Access denied."
# Sent when a player has entered too many wrong passwords and must wait.
# Limits are configured under 'security' in config.yml.
too_many_attempts: "&cToo many incorrect passwords. Try again in {seconds} second(s)."

# --- Trust System Commands (/trust, /untrust) ---

# Sent when /trust is used incorrectly.
usage_trust: "&cUsage: /trust <player> or /trust list"
# Sent when /untrust is used incorrectly.
usage_untrust: "&cUsage: /untrust <player> or /untrust all"
# Sent when a player is not found (online).
player_not_found: "&cPlayer '{player}' is not online."
# Sent when trying to trust yourself.
cannot_trust_yourself: "&cYou cannot trust yourself."
# Sent when successfully trusting a player.
player_trusted: "&aYou have trusted &e{player}&a. They can now access your locked containers."
# Sent to the player who was trusted.
trusted_by_player: "&a&l{player} &ahas given you access to their locked containers."
# Sent when trying to trust a player who is already trusted.
player_already_trusted: "&e{player} is already trusted."
# Sent when successfully untrusting a player.
player_untrusted: "&cYou have removed trust from &e{player}&c. They can no longer access your locked containers."
# Sent to the player who was untrusted.
untrusted_by_player: "&c&l{player} &chas removed your access to their locked containers."
# Sent when trying to untrust a player who isn't trusted.
player_not_trusted: "&e{player} is not in your trusted list."
# Sent when no players are trusted.
no_trusted_players: "&eYou haven't trusted any players yet."
# Sent when successfully untrusting all players.
all_players_untrusted: "&cRemoved trust from {count} players."
# Sent when untrust all fails.
untrust_all_failed: "&cFailed to remove trust from players."

# --- Trust List Display ---

# Header for trusted players list.
trusted_players_header: "&6=== &eTrusted Players &6==="
# Entry format for each trusted player.
trusted_player_entry: "&7- &e{player} &7({status})"
# Footer for trusted players list.
trusted_players_footer: "&6=== &eTotal: {count} players &6==="
# Online status indicator.
player_status_online: "&aOnline"
# Offline status indicator.
player_status_offline: "&7Offline"

# --- Container Limit Messages ---
#
# {container} is available in all of these and is replaced with the container type name, for example
# "shulker box". It is only meaningful when per-family limits are enabled
# (container-limits.enabled in config.yml); with the overall limit it falls back to a generic word.

# Sent when a player would exceed their overall limit.
limit_exceeded: "&cYou cannot lock any more containers. Using {current}/{limit}, trying to lock {trying} more."
# Sent when a player would exceed their limit for one container type.
limit_exceeded_type: "&cYou cannot lock any more of that container type. Using {current}/{limit} {container}, trying to lock {trying} more."
# Sent when a [Private] sign would exceed the player's overall limit.
sign_limit_exceeded: "&cThis private sign would take you past your limit. Using {current}/{limit}, it would lock {trying} more."
# Sent when a [Private] sign would exceed the player's limit for one container type.
sign_limit_exceeded_type: "&cThis private sign would take you past your limit for that container type. Using {current}/{limit} {container}, it would lock {trying} more."
# Sent when a player is approaching their limit.
limit_warning: "&eYou have {remaining} of {limit} locks remaining."
# Sent when a player has reached their limit.
limit_reached: "&cYou have reached your limit of {limit}."
# Sent to show the current limit status after locking.
limit_status: "&7Locks used: {status}"
# The word shown instead of a number when a player has no limit.
limit_unlimited: "Unlimited"


# --- Sign Protection Messages ---

# Sent when no chest is found near a [Private] sign.
sign_no_chest_found: "&cNo chest found near this sign. Place the sign on or next to a chest."
# Sent when trying to create a [Private] sign on an already locked chest.
sign_chest_already_locked: "&cThis chest is already locked."
# Sent when a container is successfully locked via sign. {container} is the container type name.
sign_chest_locked: "&aThis {container} is now locked with a private sign."
# Sent when sign-based locking fails.
sign_lock_failed: "&cFailed to lock chest with sign."
# Sent when trying to break someone else's private sign.
sign_cannot_break: "&cYou cannot break this private sign."
# Sent when a chest is unlocked by breaking its private sign.
sign_chest_unlocked: "&aChest unlocked by removing private sign."
# Sent when an admin breaks a private sign.
admin_sign_break_notice: "&e(Admin) You broke a private sign and unlocked the chest."

# --- ClearChests Command (/clearchests) ---

# Sent when the /clearchests command starts.
cleaning_start: "&eStarting cleanup of orphaned chest data..."
# Sent when /clearchests finishes, showing how many entries were removed.
# Renamed from 'cleared_chests' to 'cleaned_chests' for clarity.
cleaned_chests: "&a✔ Cleaned {amount} orphaned container entries."
# Sent when /clearchests runs but finds no entries to clean.
no_chests_to_clean: "&aNo orphaned container entries found to clean."

# Sent when some records could not be checked because their chunks are not loaded.
# These are left untouched on purpose: an unloaded chunk is not proof that the container is gone.
clean_skipped_unloaded: "&7{amount} record(s) were skipped because their chunks are not loaded."
# Sent when a cleanup is requested while one is already running.
cleanup_already_running: "&eA cleanup is already running. Try again in a moment."

# --- Admin Command (/privatechest) ---

# Shown when /privatechest is used without a valid subcommand.
usage_privatechest: "&eUsage: /privatechest <reload|status|save|migrate>"
# Sent when the configuration is successfully reloaded.
reload_success: "&a✔ PrivateChest configuration and messages reloaded successfully."

# --- Admin Command: /privatechest status ---

status_header: "&6=== &ePrivateChest Status &6==="
status_storage: "&7Storage backend: &f{type}"
status_containers: "&7Protected containers: &f{amount}"
status_trust: "&7Trust relations: &f{amount}"
status_container_types: "&7Protectable container types: &f{amount}"
status_pending: "&7Unsaved changes: &f{state}"
status_pending_yes: "&eyes"
status_pending_no: "&anone"

# --- Admin Command: /privatechest save ---

# Sent when queued changes were written to disk on demand.
save_success: "&a✔ All pending changes have been written to disk."
# Sent when the save could not be completed. Check the console for the reason.
save_failed: "&cCould not write pending changes. See the console for details."

# --- Admin Command: /privatechest migrate ---

# Shown when the migrate subcommand is used without a valid target.
usage_migrate: "&eUsage: /privatechest migrate <yaml|sqlite>"
# Sent when a migration begins.
migrate_started: "&eMigrating storage to {type}. This may take a moment..."
# Sent when a migration completes. The previous data files are kept as a backup.
migrate_success: "&a✔ Storage migrated to {type}. The previous data files were kept as a backup."
# Sent when the requested backend is already the active one.
migrate_already_active: "&e{type} is already the active storage backend."
# Sent when a migration failed. The original backend stays in use and is untouched.
migrate_failed: "&cMigration failed. The current storage backend is unchanged. See the console for details."

# --- Security Protection Messages ---

# Sent when a player tries to place an automated extraction block near a container they cannot use.
automated_block_placement_denied: "&cYou cannot place {block} next to a container you do not have access to."

# Names used for {block} in the message above. Translate these for your language.
block_name_hopper: "a hopper"
block_name_dropper: "a dropper"
block_name_dispenser: "a dispenser"

# --- Container Renaming Messages ---

# Usage message for the /renamecontainer command.
usage_rename_container: "&eUsage: /renamecontainer <name> or /renamecontainer remove"
# Sent when a container is successfully renamed.
container_name_set: "&aContainer renamed to '&f{name}&a'."
# Sent when a container name is successfully removed.
container_name_removed: "&aCustom name removed from {container}."
# Sent when trying to rename a container that isn't protected.
container_not_protected: "&cThis container is not protected."
# Sent when trying to rename a container you don't own.
container_not_owned: "&cYou can only rename containers you own."
# Sent when trying to remove a name from a container that doesn't have one.
container_no_custom_name: "&cThis container doesn't have a custom name to remove."
# Sent when the proposed name is empty.
name_empty: "&cContainer name cannot be empty."
# Sent when the proposed name is too short.
name_too_short: "&cContainer name must be at least {details} characters long."
# Sent when the proposed name is too long.
name_too_long: "&cContainer name cannot exceed {details} characters."
# Sent when the proposed name contains invalid characters.
name_invalid_characters: "&cContainer name can only contain letters, numbers, spaces, hyphens, and underscores."
# Sent when the proposed name is forbidden.
name_forbidden: "&cThis name is not allowed."
# Used for {container} when the container type cannot be determined.
container_generic_name: "container"

# --- Container Type Names ---

# Shown for {container} when a container has no custom name.
# These are grouped by family: all shulker box colours share one name, and every oxidation stage of
# a copper chest shares one name.
container_type_chest: "chest"
container_type_trapped_chest: "trapped chest"
container_type_copper_chest: "copper chest"
container_type_barrel: "barrel"
container_type_shulker_box: "shulker box"
container_type_crafter: "crafter"
container_type_other: "container"

# --- Notifications & Warnings ---

# These support {container} and {owner}.
# {container} is the container's custom name if it has one, set with /renamecontainer, and otherwise
# the container type name. {owner} is the owner's player name.

# Sent to the owner when they open their own locked container.
owner_access_notice: "&7(Your {container})"
# Sent to an admin when they open a locked container using bypass.
admin_access_notice: "&6(Admin access to {owner}'s {container})"
# Sent to a trusted player when they open a locked container.
trusted_access_notice: "&b(Trusted access to {owner}'s {container})"
# Sent to the owner when they break their locked container.
chest_break_warning: "&eYou broke your locked {container}."
# Sent to an admin when they break a locked container.
admin_chest_break_notice: "&e(Admin) You broke {owner}'s protected {container}."