# Main plugin definition
name: PrivateChest
version: 3.0
main: me.tuplugin.privatechest.PrivateChest
# Minimum Spigot/Paper API version required (1.16 ensures modern methods)
api-version: '1.16'
# Folia support - indicates the plugin is compatible with Folia's regionized threading
folia-supported: true
author: Koyere
description: A plugin that allows players to lock chests with a personal password.
# Optional: Link to your SpigotMC or GitHub page
website: https://www.spigotmc.org/resources/privatechest.124359/
# Soft dependencies for optional integrations
softdepend: [floodgate, Geyser-Spigot, Geyser-Paper, Geyser-Folia]

# Command definitions
commands:
  lockchest:
    description: Lock the container you're looking at using a password.
    usage: /lockchest <password>

  unlockchest:
    description: Unlock your locked container by entering the password.
    usage: /unlockchest <password>

  privatechest:
    description: Administration - reload, status, save and storage migration.
    usage: /privatechest <reload|status|save|migrate>
    # Optional: Added a short alias for convenience
    aliases: [pc]

  clearchests:
    description: Remove orphaned container entries from data.yml.
    usage: /clearchests

  trust:
    description: Give another player access to your locked containers.
    usage: /trust <player> or /trust list

  untrust:
    description: Remove access from a player to your locked containers.
    usage: /untrust <player> or /untrust all

  renamecontainer:
    description: Set or remove a custom name for a protected container.
    usage: /renamecontainer <name> or /renamecontainer remove
    aliases: [renamechest]

# Permission definitions
permissions:
  privatechest.use:
    description: Grants all player commands and sign protection. Acts as a parent permission.
    default: true
    children:
      privatechest.lock: true
      privatechest.unlock: true
      privatechest.trust: true
      privatechest.untrust: true
      privatechest.rename: true
      privatechest.sign: true

  # --- Granular Command Permissions (v2.3.1+) ---
  # These allow fine-grained control over individual commands.
  # If privatechest.use is granted, all of these are included automatically.
  # Deny specific ones to block individual commands while keeping the rest.

  privatechest.lock:
    description: Allows using /lockchest to lock containers.
    default: true

  privatechest.unlock:
    description: Allows using /unlockchest to unlock containers.
    default: true

  privatechest.trust:
    description: Allows using /trust to give other players access.
    default: true

  privatechest.untrust:
    description: Allows using /untrust to revoke player access.
    default: true

  privatechest.rename:
    description: Allows using /renamecontainer to name protected containers.
    default: true

  privatechest.sign:
    description: Allows locking containers via [Private] signs.
    default: true

  privatechest.admin:
    description: Allows use of admin commands and bypass protection.
    # Defaults to op, so only server operators have admin rights by default.
    default: op

  # Chest limit permissions
  privatechest.limit.unlimited:
    description: Allows unlimited chest locks.
    default: false

  privatechest.limit.1000:
    description: Allows locking up to 1000 chests.
    default: false

  privatechest.limit.500:
    description: Allows locking up to 500 chests.
    default: false

  privatechest.limit.100:
    description: Allows locking up to 100 chests.
    default: false

  privatechest.limit.50:
    description: Allows locking up to 50 chests.
    default: false

  privatechest.limit.25:
    description: Allows locking up to 25 chests.
    default: false

  privatechest.limit.20:
    description: Allows locking up to 20 chests.
    default: false

  privatechest.limit.15:
    description: Allows locking up to 15 chests.
    default: false

  privatechest.limit.10:
    description: Allows locking up to 10 chests.
    default: false

  privatechest.limit.5:
    description: Allows locking up to 5 chests.
    default: false

  privatechest.limit.3:
    description: Allows locking up to 3 chests.
    default: false

  privatechest.limit.1:
    description: Allows locking up to 1 chest.
    default: false

  # --- Per-family limits (v3.0+) ---
  #
  # Format: privatechest.limit.<family>.<number>  or  privatechest.limit.<family>.unlimited
  # Enabled by setting container-limits.enabled to true in config.yml.
  #
  # Families group containers that are the same thing to a player. All seventeen shulker box colours
  # are 'shulker_box', and every oxidation and waxed stage of a copper chest is 'copper_chest'.
  # 3.0 replaced the per-colour nodes from 2.x, which could never cover copper chests because their
  # material changes as they oxidize.
  #
  # Valid families: chest, trapped_chest, copper_chest, barrel, shulker_box, crafter, other
  # Any number may be used in place of the examples registered below.

  privatechest.limit.chest.unlimited:
    description: Allows unlimited chest locks.
    default: false
  privatechest.limit.chest.50:
    description: Allows locking up to 50 chests.
    default: false
  privatechest.limit.chest.25:
    description: Allows locking up to 25 chests.
    default: false
  privatechest.limit.chest.10:
    description: Allows locking up to 10 chests.
    default: false

  privatechest.limit.trapped_chest.unlimited:
    description: Allows unlimited trapped chest locks.
    default: false
  privatechest.limit.trapped_chest.10:
    description: Allows locking up to 10 trapped chests.
    default: false
  privatechest.limit.trapped_chest.5:
    description: Allows locking up to 5 trapped chests.
    default: false

  privatechest.limit.copper_chest.unlimited:
    description: Allows unlimited copper chest locks, at any oxidation stage.
    default: false
  privatechest.limit.copper_chest.25:
    description: Allows locking up to 25 copper chests.
    default: false
  privatechest.limit.copper_chest.10:
    description: Allows locking up to 10 copper chests.
    default: false

  privatechest.limit.barrel.unlimited:
    description: Allows unlimited barrel locks.
    default: false
  privatechest.limit.barrel.20:
    description: Allows locking up to 20 barrels.
    default: false
  privatechest.limit.barrel.10:
    description: Allows locking up to 10 barrels.
    default: false
  privatechest.limit.barrel.5:
    description: Allows locking up to 5 barrels.
    default: false

  privatechest.limit.shulker_box.unlimited:
    description: Allows unlimited shulker box locks, in any colour.
    default: false
  privatechest.limit.shulker_box.10:
    description: Allows locking up to 10 shulker boxes.
    default: false
  privatechest.limit.shulker_box.5:
    description: Allows locking up to 5 shulker boxes.
    default: false
  privatechest.limit.shulker_box.3:
    description: Allows locking up to 3 shulker boxes.
    default: false
  privatechest.limit.shulker_box.1:
    description: Allows locking up to 1 shulker box.
    default: false

  privatechest.limit.crafter.unlimited:
    description: Allows unlimited crafter locks.
    default: false
  privatechest.limit.crafter.10:
    description: Allows locking up to 10 crafters.
    default: false
  privatechest.limit.crafter.5:
    description: Allows locking up to 5 crafters.
    default: false