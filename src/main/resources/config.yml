# -------------------------------------------------- #
#            PrivateChest Configuration File         #
# -------------------------------------------------- #
#
# Welcome to the PrivateChest configuration!
# Here you can customize how the plugin behaves on your server.
# Use standard Bukkit color codes (&) for messages.
#

# --- Storage Settings ---

# Choose the storage system for chest data.
# Options: 'yaml' (default) or 'sqlite'
#
# YAML: Simple file-based storage, good for small to medium servers.
# SQLite: Database storage, better performance for large servers with many locked chests.
#
# You can move all existing data between backends at any time with:
#   /privatechest migrate <yaml|sqlite>
# The migration keeps the old files in place as a backup and updates this setting for you.
# Default: yaml
storage-type: yaml

# How often, in seconds, pending changes are written to disk.
#
# Changes are no longer written one by one while players are locking and unlocking containers.
# They are collected in memory and written by a background thread on this interval, which is what
# keeps busy servers from stuttering on every lock, break or /trust.
#
# Lower values write more often and lose less on a hard crash.
# Higher values write less often. A crash can lose up to this many seconds of changes.
# Anything above 300 is rejected, and 0 or less falls back to the default.
#
# A clean shutdown or restart always writes everything, regardless of this setting.
# You can also force a write at any time with /privatechest save.
#
# Default: 5
save-interval-seconds: 5

# --- Message Prefix Settings ---

# Should the plugin add a prefix before its messages?
# Default: true
use-prefix: true

# The prefix to display before messages (only if 'use-prefix' is true).
# Default: "&7[&6PrivateChest&7] "
prefix: "&7[&6PrivateChest&7] "

# --- Language ---

# Which bundled translation to use.
#
# Translations live in plugins/PrivateChest/lang/. On first start, the one named here is copied to
# messages.yml, which becomes your active, editable file. Changing this later does not overwrite
# messages.yml; delete that file if you want it recreated in another language.
#
# Bundled: en, es
# To add your own: copy a file in lang/ to lang/<code>.yml and translate the values.
# Default: en
language: en

# Serve each player messages in their own client language.
#
# When on, every lang/<code>.yml file is loaded and each player is matched to one by their Minecraft
# language setting. Anything a translation is missing falls back to messages.yml.
# When off, everyone gets messages.yml.
# Default: false
use-player-locale: false

# --- Container Names ---

# Rules for the names players can give containers with /renamecontainer.
container-names:
  # Shortest and longest allowed name.
  # Default: 1 and 16
  min-length: 1
  max-length: 16

  # Which characters are allowed, as a regular expression.
  #
  # The default accepts letters and digits in any language, plus spaces, hyphens and underscores.
  # \p{L} is "any letter" and \p{N} is "any digit", so accented and non-Latin characters work.
  # Default: "^[\\p{L}\\p{N}_\\-\\s]+$"
  pattern: "^[\\p{L}\\p{N}_\\-\\s]+$"

  # Names that are not allowed, whatever the pattern says. Case is ignored.
  # Add the equivalents in your own language: a player naming a container "admin" or "server" is
  # usually trying to mislead someone.
  forbidden:
    - "null"
    - "undefined"
    - "admin"
    - "console"
    - "system"
    - "server"
    - "privatechest"
    - "staff"
    - "owner"

# --- Protectable Containers ---

# Which blocks players are allowed to protect.
#
# The plugin already knows about every vanilla container: chests, trapped chests, barrels, all
# shulker box colours, crafters, and copper chests including every oxidation and waxed stage.
# Entries that do not exist on your Minecraft version are simply skipped, so this same list works
# on 1.16 and on the latest release.
containers:
  # Automatically protect containers this plugin version has never heard of, matched by name.
  # This is what lets a container added by a future Minecraft update be protectable on day one,
  # without waiting for a plugin update. Turn it off if you want an exact, fixed list.
  # Default: true
  auto-discover: true

  # Name patterns used by auto-discover. '*' matches any text.
  # Only block materials are considered.
  # Default: ["*_CHEST", "*_SHULKER_BOX"]
  discovery-patterns:
    - "*_CHEST"
    - "*_SHULKER_BOX"

  # Extra containers to allow, by material name. Use this to protect things the plugin does not
  # cover by default, for example:
  #   - FURNACE
  #   - BLAST_FURNACE
  #   - SMOKER
  #   - BREWING_STAND
  additional: []

  # Containers players must never be able to protect, even if a pattern matches them.
  # ENDER_CHEST is here because it is already private to each player; protecting one only breaks it.
  # Default: ["ENDER_CHEST"]
  excluded:
    - "ENDER_CHEST"

  # Containers to stop allowing, by material name. Existing protections on these are left alone.
  # Example: disallow new shulker box locks without touching the ones players already have.
  disabled: []

  # Log which known containers are not available on this server version, at startup.
  # Only useful when troubleshooting; it is normal for an older server to be missing newer ones.
  # Default: false
  log-unavailable: false

# --- Feature Settings ---

# Enable sign-based protection: writing the private tag on a sign next to a container locks it.
#
# The tag itself is part of the translation, not a fixed word. It lives in messages.yml under
# 'sign_tag', with 'sign_tag_aliases' for other accepted spellings, so a Spanish server can use
# [Privado] instead of [Private].
# Default: true
enable-sign-protection: true

# Enable container limits based on player permissions.
# When on, players can only lock a maximum number of containers.
# Default: false
enable-chest-limits: false

# How many containers a player can lock when they have no limit permission.
# Only used when enable-chest-limits is true. A limit permission always overrides this.
# Default: 5
default-chest-limit: 5

# --- Container Limits (Granular) ---

# Advanced container limits system that allows different limits per container type.
# This provides more granular control compared to the basic chest limits above.
# When enabled, this system takes precedence over the basic limits.
container-limits:
  # Enable granular container limits by type
  # Default: false (uses basic chest limits instead)
  enabled: false
  
  # Default limit for all container types if no specific limit is set
  # Default: 5
  default-limit: 5
  
  # Limits per container family.
  #
  # Families group containers that are the same thing to a player. All seventeen shulker box colours
  # count as 'shulker_box', and every oxidation and waxed stage of a copper chest counts as
  # 'copper_chest'. That matters because a copper chest changes material as it weathers: keying
  # limits on the family means a player's count does not shift when their chests oxidize.
  #
  # Players need a permission to exceed these defaults:
  #   privatechest.limit.<family>.<number>   or   privatechest.limit.<family>.unlimited
  types:
    chest: 10
    trapped_chest: 5
    copper_chest: 10
    barrel: 5
    crafter: 5

    # Shulker boxes hold more value per block, so a lower default is usual.
    shulker_box: 2

    # Anything added through 'containers.additional' that is not one of the families above.
    other: 5

# --- Security Settings ---

security:
  # How many rounds of PBKDF2 are used to hash container passwords.
  #
  # Higher values make a stolen data file harder to attack offline, and make /unlockchest take
  # slightly longer. The cost is paid once per command, so it is not a performance concern at
  # normal values.
  #
  # Existing passwords are upgraded automatically the next time they are entered correctly, so
  # raising this strengthens old passwords over time without any migration step.
  #
  # Allowed range: 1000 to 1000000. Values outside it are clamped.
  # Default: 20000
  password-hash-iterations: 20000

  # How many wrong passwords a player may enter before being made to wait.
  # Default: 5
  max-password-attempts: 5

  # How long wrong attempts are remembered, in seconds. Attempts older than this do not count
  # towards the limit above.
  # Default: 60
  attempt-window-seconds: 60

  # How long a player must wait after hitting the limit, in seconds.
  # Default: 300 (5 minutes)
  lockout-seconds: 300

  # Log wrong password attempts to the console, with the player name and container position.
  # Useful for spotting someone probing other players' containers.
  # Default: true
  log-failed-attempts: true

# --- Notification Settings ---

# Should the owner receive a small notification message when they
# successfully open one of their own locked containers?
# Default: true
notify-owner-on-open: true

# Should an admin receive a small notification message when they
# open a container using their bypass permission (privatechest.admin)?
# Default: true
notify-admin-on-open: true

# Should a trusted player receive a small notification message when they
# open a container they have been given access to?
# Default: true
notify-trusted-on-open: true

# --- Auto-Cleanup Settings ---

# Automatic cleanup of orphaned container data and trust relationships.
# This helps maintain database integrity and performance by removing
# data for containers that no longer exist in the world.
auto-cleanup:
  # Run a pass shortly after the server starts.
  # Default: true
  startup-enabled: true

  # How long after startup to wait, in seconds. Give world managers time to mount their worlds.
  # Default: 10
  startup-delay-seconds: 10

  # Run a pass periodically while the server is up.
  # Default: true
  periodic-enabled: true

  # Minutes between periodic passes. Set to 0 to disable them.
  # Default: 30
  interval-minutes: 30

  # How many chunks a periodic pass will examine. A large dataset is spread over several passes
  # rather than checked all at once. Set to 0 for no limit.
  # Default: 200
  max-chunks-per-pass: 200

  # How many chunks are examined per tick on single-threaded servers. Lower is gentler.
  # Ignored on Folia, where each chunk is handled by the thread that owns it.
  # Default: 20
  chunks-per-tick: 20

  # Delete a player's trusted list when they own no protected containers.
  #
  # OFF by default, and that is a deliberate change from 2.x, which always did this and quietly
  # destroyed real data: a player who ran /trust before locking their first container lost the whole
  # list within half an hour, and so did anyone who temporarily broke all of their containers.
  #
  # Trust relations are a few bytes each. There is very little reason to turn this on.
  # Default: false
  remove-unused-trust: false

# Positions in chunks that are not loaded are never touched by any cleanup pass, on any setting.
# An unloaded chunk is not evidence that a container is gone.

# --- Hopper Protection Settings ---

# Controls whether hoppers and other automated systems can move items
# to/from locked containers.
#
# ⚠️ SECURITY WARNING:
# Disabling this protection allows ANY hopper (regardless of who placed it)
# to extract items from locked containers. This may allow other players to
# steal items using clever hopper placements.
#
# RECOMMENDED USE CASES for disabling (allow-hopper-access: true):
# - Private/trusted servers where theft is not a concern
# - Servers with claim/protection plugins that prevent hopper placement
# - Players who want automated sorting systems with their locked chests
#
# When enabled, hoppers CAN:
# - Transfer items into locked containers
# - Extract items from locked containers
# - Work with automated sorting/storage systems
#
# When disabled (default), hoppers CANNOT:
# - Move items to or from ANY locked container
# - Be picked up into one by a hopper or hopper minecart
# - Be placed next to a container the placing player has no access to
#
# Players can still place hoppers next to containers they own or are trusted on, so their own
# sorting systems keep working. 2.x refused next to any locked container, including your own.
#
# Default: false (maximum security - blocks all hopper access)
hopper-protection:
  # Set to true to allow hoppers to access locked containers
  # Set to false to block all automated item movement (most secure)
  # Default: false
  allow-hopper-access: false

# --- Notes on Removed Options ---
#
# - allow-double-chests: Removed as double chest support is now core.
# - unlock-duration-seconds: Removed as temporary unlock is not currently implemented.
# - allow-shared-access: Removed as shared access (non-owner unlock with password)
#   is not currently implemented.
#
# If these features are added in the future, their options can be restored.
#