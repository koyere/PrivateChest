# Shown for {container} when a container has no custom name. Grouped by family: all shulker box
# colours share one name, and every oxidation stage of a copper chest shares one name.

container_type_chest: "chest"
container_type_trapped_chest: "trapped chest"
container_type_copper_chest: "copper chest"
container_type_barrel: "barrel"
container_type_shulker_box: "shulker box"
container_type_crafter: "crafter"
container_type_other: "container"

# --- Access notices ---
