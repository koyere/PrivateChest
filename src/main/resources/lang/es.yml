# -------------------------------------------------- #
#           PrivateChest Mensajes - Español           #
# -------------------------------------------------- #
#
# Este archivo puede estar en dos sitios, y en cada uno se comporta de forma distinta:
#
#   messages.yml   Tu archivo activo. Es el que lee el plugin y el que editas tú.
#                  Se creó a partir del idioma indicado en config.yml. Nada sobrescribe tus textos;
#                  las actualizaciones solo añaden las claves que todavía no existían.
#
#   lang/es.yml    Una plantilla de solo lectura. Se usa para crear messages.yml la primera vez, para
#                  aportar las claves nuevas en el idioma correcto tras una actualización, y para
#                  servir este idioma directamente a los jugadores si activas 'use-player-locale'.
#
# Para añadir un idioma, copia este archivo a lang/<código>.yml y traduce los valores. Después pon el
# código en 'language' dentro de config.yml, o activa 'use-player-locale' para que cada jugador
# reciba el suyo.
#
# Usa códigos de color con &. Los marcadores entre {llaves} los rellena el plugin.
#

