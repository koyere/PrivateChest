# --- Límites de contenedores ---
#
# {container} es el nombre del tipo de contenedor, por ejemplo "caja de shulker". Solo tiene sentido
# con los límites por familia activados (container-limits.enabled en config.yml); con el límite global
# se sustituye por una palabra genérica.

limit_exceeded: "&cNo puedes proteger más contenedores. Llevas {current}/{limit} y quieres proteger {trying} más."
limit_exceeded_type: "&cNo puedes proteger más contenedores de ese tipo. Llevas {current}/{limit} {container} y quieres proteger {trying} más."
sign_limit_exceeded: "&cEste cartel te pasaría del límite. Llevas {current}/{limit} y protegería {trying} más."
sign_limit_exceeded_type: "&cEste cartel te pasaría del límite para ese tipo de contenedor. Llevas {current}/{limit} {container} y protegería {trying} más."
limit_warning: "&eTe quedan {remaining} de {limit} protecciones."
limit_reached: "&cHas alcanzado tu límite de {limit}."
limit_status: "&7Protecciones usadas: {status}"
limit_unlimited: "Sin límite"

# --- Protección con carteles ---
#
# La etiqueta es el texto que un jugador escribe en un cartel para proteger el contenedor de al lado.
# Puedes traducirla libremente. La comparación ignora mayúsculas, códigos de color y espacios.

# La etiqueta de este idioma.
sign_tag: "[Privado]"
# Otras formas también aceptadas, para poder cambiar de idioma sin romper los carteles existentes.
sign_tag_aliases:
  - "[Privado]"
  - "[Private]"
# En qué se convierte la primera línea cuando el contenedor queda protegido.
sign_tag_locked: "&4[&cPrivado&4]"

sign_no_chest_found: "&cNo hay ningún contenedor junto a este cartel. Colócalo sobre uno o a su lado."
sign_chest_already_locked: "&cEste contenedor ya está protegido."
# {container} es el nombre del tipo de contenedor.
sign_chest_locked: "&aEste {container} queda protegido con un cartel privado."
sign_lock_failed: "&cNo se ha podido proteger el contenedor con este cartel."
sign_cannot_break: "&cNo puedes romper este cartel privado."
sign_chest_unlocked: "&aProtección retirada al quitar el cartel privado."
admin_sign_break_notice: "&e(Admin) Has roto un cartel privado y retirado la protección."

